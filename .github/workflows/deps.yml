name: Dependencies

on:
  push:
    paths:
      - Gemfile
      - Gemfile.lock

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      - uses: NixOS/nix-installer-action@v1.0.0
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            experimental-features = nix-command flakes
      - name: Run bundix
        run: nix develop .#deps --command bundix
      - uses: stefanzweifel/git-auto-commit-action@v7.2.1
        with:
          commit_message: "Update gemset.nix"
          commit_user_name: robbevp
          commit_user_email: bot@robbevp.be
          commit_author: robbe[bot] <bot@robbevp.be>
